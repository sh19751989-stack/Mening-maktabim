
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mening Maktabim</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172033}
    header{background:#1746a2;color:white;padding:22px;text-align:center}
    header h1{margin:0 0 8px}
    main{max-width:900px;margin:25px auto;padding:16px}
    .card{background:white;padding:22px;border-radius:16px;margin-bottom:18px;box-shadow:0 5px 20px #152b4b12}
    input,select,button{width:100%;padding:12px;margin:7px 0;border-radius:9px;border:1px solid #ccd5e1;font-size:16px}
    button{background:#1746a2;color:white;border:0;cursor:pointer;font-weight:bold}
    button:hover{background:#10377f}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
    .subject{min-height:65px}
    .hidden{display:none}
    #message{white-space:pre-wrap;overflow-wrap:anywhere}
    .muted{color:#64748b;font-size:14px}
  </style>
</head>
<body>
<header>
  <h1>🎓 Mening Maktabim</h1>
  <p>Bilim ol — kelajagingni yarat!</p>
</header>

<main>
  <div class="card">
    <h2>Sayt sozlamasi</h2>
    <p class="muted">Supabase loyihang URL manzili va publishable key qiymatini kiriting.</p>
    <input id="projectUrl" placeholder="https://PROJECT_ID.supabase.co">
    <input id="publicKey" placeholder="Supabase publishable key">
    <button id="connectBtn">Supabase'ga ulanish</button>
    <p id="message"></p>
  </div>

  <section id="auth" class="card">
    <h2>Hisobga kirish</h2>
    <input id="email" type="email" placeholder="Email manziling">
    <input id="password" type="password" placeholder="Parol">
    <button id="loginBtn">Kirish</button>
    <hr>
    <h3>Yangi hisob yaratish</h3>
    <input id="fullName" placeholder="Ism va familiya">
    <input id="school" placeholder="Maktab nomi">
    <select id="grade">
      <option value="">Sinfni tanlang</option>
      <option>1</option><option>2</option><option>3</option>
      <option>4</option><option>5</option><option>6</option>
      <option>7</option><option>8</option><option>9</option>
      <option>10</option><option>11</option>
    </select>
    <button id="signupBtn">Ro‘yxatdan o‘tish</button>
    <button id="logoutBtn" class="hidden">Chiqish</button>
  </section>

  <section id="dashboard" class="card hidden">
    <h2 id="welcome">Xush kelibsiz!</h2>
    <p>Fanlardan birini tanlang:</p>
    <div class="grid" id="subjects"></div>
    <div id="quizArea"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  let db = null;
  let currentQuestions = [];
  let currentIndex = 0;
  let score = 0;

  const subjects = [
    "Kimyo","Fizika","Algebra","Informatika",
    "Biologiya","Tarix","Rus tili","Ingliz tili"
  ];

  // Namuna savollar. To‘liq 8 800 ta savol bu namunaga kiritilmagan.
  const samples = {
    "Algebra":[
      {q:"2 + 3 = ?",a:["4","5","6","7"],correct:1},
      {q:"5 × 4 = ?",a:["9","15","20","25"],correct:2}
    ],
    "Ingliz tili":[
      {q:"'Kitob' ingliz tilida qanday?",a:["Pen","Book","Door","Desk"],correct:1},
      {q:"'Apple' so‘zining tarjimasi?",a:["Olma","Nok","Uzum","Anor"],correct:0}
    ],
    "Kimyo":[
      {q:"Suvning formulasi qaysi?",a:["CO₂","O₂","H₂O","NaCl"],correct:2}
    ],
    "Fizika":[
      {q:"Kuchning SI birligi?",a:["Joul","Nyuton","Vatt","Metr"],correct:1}
    ],
    "Informatika":[
      {q:"Kompyuterning asosiy hisoblash qurilmasi?",a:["Monitor","Sichqoncha","Protsessor","Printer"],correct:2}
    ],
    "Biologiya":[
      {q:"O‘simliklar fotosintezda nimadan foydalanadi?",a:["Quyosh nuridan","Plastmassadan","Temirdan","Qumdan"],correct:0}
    ],
    "Tarix":[
      {q:"O‘zbekiston mustaqilligi qaysi yilda e’lon qilingan?",a:["1989","1991","1995","2000"],correct:1}
    ],
    "Rus tili":[
      {q:"'Книга' so‘zining o‘zbekcha ma’nosi?",a:["Daftar","Qalam","Kitob","Maktab"],correct:2}
    ]
  };

  function showMessage(text, error = false) {
    $("message").textContent = text;
    $("message").style.color = error ? "#b91c1c" : "#166534";
  }

  function getClient() {
    const url = $("projectUrl").value.trim().replace(/\/+$/, "");
    const key = $("publicKey").value.trim();

    if (!/^https:\/\/[a-zA-Z0-9-]+\.supabase\.co$/.test(url)) {
      throw new Error("Supabase URL noto‘g‘ri. Masalan: https://abcdefgh.supabase.co");
    }
    if (!key) throw new Error("Supabase publishable key kiritilmagan.");
    if (!window.supabase?.createClient) {
      throw new Error("Supabase kutubxonasi yuklanmadi. Internetni tekshiring.");
    }
    return window.supabase.createClient(url, key);
  }

  $("connectBtn").addEventListener("click", async () => {
    try {
      db = getClient();
      const { error } = await db.auth.getSession();
      if (error) throw error;
      localStorage.setItem("school_project_url", $("projectUrl").value.trim());
      localStorage.setItem("school_public_key", $("publicKey").value.trim());
      showMessage("Supabase bilan ulanish tayyor.");
      await restoreSession();
    } catch (e) {
      showMessage(e.message || String(e), true);
    }
  });

  async function restoreSession() {
    if (!db) return;
    const { data, error } = await db.auth.getSession();
    if (error) throw error;
    if (data.session) showDashboard(data.session.user);
  }

  function showDashboard(user) {
    $("auth").classList.add("hidden");
    $("dashboard").classList.remove("hidden");
    $("logoutBtn").classList.remove("hidden");
    $("welcome").textContent = "Xush kelibsiz! " + (user.email || "");
    $("subjects").replaceChildren();

    subjects.forEach(subject => {
      const button = document.createElement("button");
      button.className = "subject";
      button.textContent = subject;
      button.addEventListener("click", () => startQuiz(subject));
      $("subjects").appendChild(button);
    });
  }

  $("loginBtn").addEventListener("click", async () => {
    try {
      if (!db) db = getClient();
      const email = $("email").value.trim();
      const password = $("password").value;
      if (!email || !password) throw new Error("Email va parolni kiriting.");
      const { data, error } = await db.auth.signInWithPassword({ email, password });
      if (error) throw error;
      showDashboard(data.user);
      showMessage("Hisobga muvaffaqiyatli kirildi.");
    } catch (e) {
      showMessage(e.message || String(e), true);
    }
  });

  $("signupBtn").addEventListener("click", async () => {
    try {
      if (!db) db = getClient();
      const fullName = $("fullName").value.trim();
      const school = $("school").value.trim();
      const grade = $("grade").value;
      const email = $("email").value.trim();
      const password = $("password").value;

      if (!fullName || !school || !grade || !email || !password) {
        throw new Error("Barcha maydonlarni to‘ldiring.");
      }
      if (password.length < 6) throw new Error("Parol kamida 6 belgidan iborat bo‘lsin.");

      const { data, error } = await db.auth.signUp({
        email,
        password,
        options: {
          data: {
            full_name: fullName,
            school_name: school,
            grade: grade,
            requested_role: "student"
          }
        }
      });
      if (error) throw error;

      if (data.session) {
        showDashboard(data.user);
        showMessage("Hisob yaratildi.");
      } else {
        showMessage("Hisob yaratildi. Emailingizni tasdiqlang, so‘ng kiring.");
      }
    } catch (e) {
      showMessage(e.message || String(e), true);
    }
  });

  $("logoutBtn").addEventListener("click", async () => {
    try {
      if (db) {
        const { error } = await db.auth.signOut();
        if (error) throw error;
      }
      $("dashboard").classList.add("hidden");
      $("auth").classList.remove("hidden");
      $("logoutBtn").classList.add("hidden");
      showMessage("Hisobdan chiqildi.");
    } catch (e) {
      showMessage(e.message || String(e), true);
    }
  });

  function startQuiz(subject) {
    currentQuestions = samples[subject] || [];
    currentIndex = 0;
    score = 0;
    if (!currentQuestions.length) {
      $("quizArea").textContent = subject + ": savollar hali qo‘shilmagan.";
      return;
    }
    renderQuestion(subject);
  }

  function renderQuestion(subject) {
    const area = $("quizArea");
    area.replaceChildren();

    if (currentIndex >= currentQuestions.length) {
      const result = document.createElement("h3");
      result.textContent = "Natija: " + score + " / " + currentQuestions.length;
      area.appendChild(result);
      return;
    }

    const item = currentQuestions[currentIndex];
    const title = document.createElement("h3");
    title.textContent = subject + " — " + (currentIndex + 1) + "-savol";
    area.appendChild(title);

    const question = document.createElement("p");
    question.textContent = item.q;
    area.appendChild(question);

    item.a.forEach((answer, index) => {
      const button = document.createElement("button");
      button.textContent = answer;
      button.addEventListener("click", () => {
        if (index === item.correct) score++;
        currentIndex++;
        renderQuestion(subject);
      });
      area.appendChild(button);
    });
  }

  (async () => {
    $("projectUrl").value = localStorage.getItem("school_project_url") || "";
    $("publicKey").value = localStorage.getItem("school_public_key") || "";
    if ($("projectUrl").value && $("publicKey").value) {
      try {
        db = getClient();
        await restoreSession();
      } catch (e) {
        showMessage(e.message || String(e), true);
      }
    }
  })();
})();
</script>
</body>
</html>
